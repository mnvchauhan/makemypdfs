<!DOCTYPE html>
<html lang="en">
<head>
    <title>Dashboard - MakeMyPDFs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <div class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
            MakeMyPDFs
        </div>
        <div class="flex items-center gap-4">
            <span class="text-gray-300">Hello, <b>{{ request.user.username }}</b>!</span>
            <a href="{% url 'logout' %}" class="bg-red-500/10 text-red-500 border border-red-500 px-4 py-2 rounded hover:bg-red-500 hover:text-white transition">Logout</a>
        </div>
    </nav>

    <div class="container mx-auto p-8 mt-10">
        <h1 class="text-4xl font-extrabold mb-2">Your Workspace</h1>
        <p class="text-gray-400 mb-10">Select a tool below to start processing your documents.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <a href="#" class="bg-gray-800 p-6 rounded-xl border border-gray-700 hover:border-blue-500 hover:shadow-[0_0_15px_rgba(59,130,246,0.5)] transition transform hover:-translate-y-1">
                <div class="text-blue-500 text-4xl mb-4">📄+📄</div>
                <h3 class="text-xl font-bold mb-2">Merge PDFs</h3>
                <p class="text-gray-400 text-sm">Combine multiple PDF files into a single document instantly.</p>
            </a>

            <a href="#" class="bg-gray-800 p-6 rounded-xl border border-gray-700 hover:border-green-500 hover:shadow-[0_0_15px_rgba(34,197,94,0.5)] transition transform hover:-translate-y-1">
                <div class="text-green-500 text-4xl mb-4">🗜️</div>
                <h3 class="text-xl font-bold mb-2">Compress PDF</h3>
                <p class="text-gray-400 text-sm">Reduce file size without losing quality using PyMuPDF.</p>
            </a>

            </div>
    </div>

</body>
</html>
