<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Login - MakeMyPDFs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #020617; color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        
        /* Desktop Form Styling */
        .auth-card { background-color: #0f172a; border: 1px solid #1e293b; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        form input { width: 100%; padding: 14px 16px 14px 44px; border-radius: 12px; font-size: 15px; outline: none; transition: all 0.3s ease; background-color: rgba(30, 41, 59, 0.5); border: 1px solid #334155; color: #f8fafc; }
        form input:focus { border-color: #e5322d; box-shadow: 0 0 0 4px rgba(229, 50, 45, 0.15); }
        
        /* 🔥 MOBILE APP MAGIC CSS 🔥 */
        @media (max-width: 768px) {
            body { background-color: #000000; padding-bottom: 85px; }
            .auth-card { background-color: #000000; border: none; box-shadow: none; padding: 10px !important; }
            form input { background-color: #18181b; border: 1px solid #27272a; }
            .desktop-only { display: none !important; }
        }
    </style>
</head>
<body class="antialiased selection:bg-[#e5322d] selection:text-white flex flex-col min-h-screen">

    <header class="bg-[#020617]/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-[100] desktop-only">
        <div class="max-w-[1600px] mx-auto flex items-center justify-between px-4 lg:px-10 h-24">
            <a href="/" class="flex items-center gap-4 text-[28px] font-black tracking-tighter text-white">
                <div class="bg-[#e5322d] text-white w-12 h-12 flex items-center justify-center rounded-xl shadow-lg shadow-red-500/20">
                    <i class="fa-solid fa-file-pdf text-xl"></i>
                </div>
                <span>MakeMy<span class="text-[#e5322d]">PDFs</span></span>
            </a>
        </div>
    </header>

    <div class="flex-grow flex items-center justify-center p-4 md:p-8">
        <div class="auth-card w-full max-w-md p-8 md:p-10 rounded-3xl flex flex-col items-center">
            
            <a href="/" class="md:hidden flex items-center gap-3 text-[26px] font-black tracking-tighter text-white mb-8 mt-4">
                <div class="bg-[#e5322d] w-10 h-10 flex items-center justify-center rounded-xl"><i class="fa-solid fa-file-pdf text-lg"></i></div>
                <span>MakeMy<span class="text-[#e5322d]">PDFs</span></span>
            </a>

            <h2 class="text-2xl md:text-3xl font-extrabold mb-6 text-center text-white">Welcome back</h2>

            <button class="w-full bg-[#18181b] md:bg-[#1e293b] border border-slate-700 hover:bg-slate-800 text-white py-3.5 rounded-xl font-semibold flex justify-center items-center gap-3 transition mb-8">
                <i class="fab fa-google text-red-500 text-lg"></i> Continue with Google
            </button>

            <div class="w-full flex items-center gap-4 mb-6 opacity-40">
                <div class="h-px bg-slate-500 flex-1"></div>
                <span class="text-xs font-bold uppercase tracking-widest text-slate-300">OR</span>
                <div class="h-px bg-slate-500 flex-1"></div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="w-full bg-red-500/10 border border-red-500/30 text-red-400 p-3 rounded-xl text-sm mb-6 text-center">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="w-full">
                {% csrf_token %}
                <div class="mb-5 relative">
                    <i class="fas fa-envelope absolute left-4 top-[15px] text-slate-500"></i>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
                <div class="mb-6 relative">
                    <i class="fas fa-lock absolute left-4 top-[15px] text-slate-500"></i>
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                
                <button type="submit" class="w-full bg-[#e5322d] hover:bg-[#cc2b26] text-white font-bold py-4 rounded-xl text-[15px] transition shadow-[0_0_20px_rgba(229,50,45,0.3)] mt-2">
                    Log in to workspace
                </button>
            </form>

            <p class="mt-8 text-sm text-slate-400">
                Don't have an account? <a href="{% url 'signup' %}" class="text-[#e5322d] font-bold hover:underline">Sign up for free</a>
            </p>
        </div>
    </div>

    <nav class="md:hidden fixed bottom-0 left-0 w-full bg-[#18181b]/95 backdrop-blur-lg border-t border-[#27272a] flex justify-around items-center h-[85px] z-[100] pb-5 pt-2">
        <a href="/" class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 w-1/4 transition-colors">
            <i class="fa-solid fa-house text-[22px] mb-1.5"></i>
            <span class="text-[11px] font-semibold">Home</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 w-1/4 transition-colors">
            <i class="fa-solid fa-folder text-[22px] mb-1.5"></i>
            <span class="text-[11px] font-semibold">Files</span>
        </a>
        <a href="#" class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300 w-1/4 transition-colors">
            <i class="fa-solid fa-star text-[22px] mb-1.5"></i>
            <span class="text-[11px] font-semibold">Pro</span>
        </a>
        <a href="/accounts/login/" class="flex flex-col items-center justify-center text-[#e5322d] w-1/4 transition-colors">
            <i class="fa-solid fa-user text-[22px] mb-1.5"></i>
            <span class="text-[11px] font-bold">Profile</span>
        </a>
    </nav>

</body>
</html>
